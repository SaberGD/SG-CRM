steps:
  - name: 'node:22'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "META_PIXEL_ID=1748422296177915" > functions/.env
        echo "META_ACCESS_TOKEN=$$META_ACCESS_TOKEN" >> functions/.env
        cd functions
        npm install
        cd ..
        npm install -g firebase-tools
        firebase deploy --only functions:metaCapiEvent --project=sg-crm-e3a38 --non-interactive
    secretEnv: ['META_ACCESS_TOKEN']
availableSecrets:
  secretManager:
    - versionName: projects/sg-crm-e3a38/secrets/META_ACCESS_TOKEN/versions/latest
      env: 'META_ACCESS_TOKEN'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
