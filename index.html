
<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SABER GROUP CRM SYSTEM</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CRM SYSTEM">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Manifest & Icon Links -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Same brand palette as the accounting and training systems (CSS variables below).
            primary: {
              50: 'rgb(var(--primary-50) / <alpha-value>)',
              100: 'rgb(var(--primary-100) / <alpha-value>)',
              200: 'rgb(var(--primary-200) / <alpha-value>)',
              300: 'rgb(var(--primary-300) / <alpha-value>)',
              400: 'rgb(var(--primary-400) / <alpha-value>)',
              500: 'rgb(var(--primary-500) / <alpha-value>)',
              600: 'rgb(var(--primary-600) / <alpha-value>)',
              700: 'rgb(var(--primary-700) / <alpha-value>)',
              800: 'rgb(var(--primary-800) / <alpha-value>)',
              900: 'rgb(var(--primary-900) / <alpha-value>)',
            },
            // The CRM used "indigo" for its brand accents; point them at the brand palette too.
            indigo: {
              50: 'rgb(var(--primary-50) / <alpha-value>)',
              100: 'rgb(var(--primary-100) / <alpha-value>)',
              200: 'rgb(var(--primary-200) / <alpha-value>)',
              300: 'rgb(var(--primary-300) / <alpha-value>)',
              400: 'rgb(var(--primary-400) / <alpha-value>)',
              500: 'rgb(var(--primary-500) / <alpha-value>)',
              600: 'rgb(var(--primary-600) / <alpha-value>)',
              700: 'rgb(var(--primary-700) / <alpha-value>)',
              800: 'rgb(var(--primary-800) / <alpha-value>)',
              900: 'rgb(var(--primary-900) / <alpha-value>)',
            },
            slate: {
              900: '#0f172a',
              950: '#020617',
            }
          },
          borderRadius: {
            '3xl': '1.5rem',
            '4xl': '2rem',
            '5xl': '3rem',
          },
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style id="theme-variables">
    :root {
      --primary-50: 252 245 244; --primary-100: 248 230 228; --primary-200: 240 204 199; --primary-300: 230 169 161;
      --primary-400: 218 128 116; --primary-500: 207 87 71; --primary-600: 196 50 31; --primary-700: 161 41 25;
      --primary-800: 129 33 20; --primary-900: 102 26 16;
    }
  </style>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    body {
      transition: background-color 0.3s ease;
      font-family: 'Cairo', sans-serif !important;
    }
    /* حل نهائي لمشكلة تقطيع الخط العربي عبر منع الـ letter-spacing تماماً */
    * {
      letter-spacing: 0 !important;
      word-spacing: 0 !important;
    }
    input, select, textarea {
      font-family: 'Cairo', sans-serif !important;
    }
    /* تحسين شكل السكرول بار في الوضع الليلي */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
  <script>
    // Service worker retired: unregister any old one and drop its caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => regs.forEach((r) => r.update().catch(() => {}).then(() => r.unregister())))
        .catch(() => {});
      if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
    }
    // Long-lived tabs: when the tab regains focus, reload if a newer bundle was deployed
    (function () {
      const current = (document.querySelector('script[type="module"][src*="assets/index-"]') || {}).src;
      if (!current) return;
      let last = 0;
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState !== 'visible' || Date.now() - last < 60000) return;
        last = Date.now();
        try {
          const html = await (await fetch('/index.html?v=' + last, { cache: 'no-store' })).text();
          const m = html.match(/assets\/index-[A-Za-z0-9_-]+\.js/);
          if (m && !current.endsWith(m[0])) location.reload();
        } catch (e) {}
      });
    })();
  </script>
</body>
</html>
