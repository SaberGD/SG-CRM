
<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark" data-color-theme="ember">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG · المبيعات</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#10100f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SG المبيعات">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Manifest & Icon Links -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  
  <script>
    // Apply the saved theme before the first paint (same key as the accounting system).
    (function () {
      try { document.documentElement.classList.toggle('dark', localStorage.getItem('theme') !== 'light'); } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style id="theme-variables">
    :root {
      --primary-50: 252 245 244; --primary-100: 248 230 228; --primary-200: 240 204 199; --primary-300: 230 169 161;
      --primary-400: 218 128 116; --primary-500: 207 87 71; --primary-600: 196 50 31; --primary-700: 161 41 25;
      --primary-800: 129 33 20; --primary-900: 102 26 16;
    }
  </style>
  <style>
    /* Arabic letters break apart with letter-spacing; keep it off everywhere. */
    * { letter-spacing: 0 !important; word-spacing: 0 !important; }
    body, input, select, textarea, button { font-family: 'Cairo', sans-serif; }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="font-sans">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
  <script>
    // Service worker retired: unregister any old one and drop its caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => regs.forEach((r) => r.update().catch(() => {}).then(() => r.unregister())))
        .catch(() => {});
      if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
    }
  </script>
</body>
</html>
